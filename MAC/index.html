<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4);
        }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center p-6">
    <div class="max-w-6xl w-full">
        <!-- Header -->
        <div class="text-center mb-12">
            <h1 class="text-5xl font-bold mb-3 tracking-tight" lang="es">¡Hola! Soy MAC 👋</h1>
            <h1 class="text-5xl font-bold mb-3 tracking-tight" lang="en" hidden>Hey! I'm MAC 👋</h1>
            <p class="text-2xl text-zinc-400">Elige tu idioma / Choose your language</p>
        </div>

        <!-- Language Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-2xl mx-auto">
            <!-- Español -->
            <a href="es/" 
               class="card-hover group bg-zinc-900 border border-violet-500/30 hover:border-violet-500 rounded-3xl p-10 flex flex-col items-center text-center">
                <div class="w-28 h-28 bg-violet-500/10 rounded-3xl flex items-center justify-center mb-8 group-hover:bg-violet-500/20 transition-colors">
                    <span class="text-7xl">🇪🇸</span>
                </div>
                <h2 class="text-4xl font-semibold mb-2">Español</h2>
                <p class="text-zinc-400 mb-10 text-xl">Cambiar a Español</p>
                <span class="inline-flex items-center px-10 py-5 bg-violet-500 hover:bg-violet-600 text-black font-semibold rounded-2xl text-2xl transition-colors">
                    Ir al sitio <i class="fa-solid fa-arrow-right ml-4"></i>
                </span>
            </a>

            <!-- English -->
            <a href="en/" 
               class="card-hover group bg-zinc-900 border border-emerald-500/30 hover:border-emerald-500 rounded-3xl p-10 flex flex-col items-center text-center">
                <div class="w-28 h-28 bg-emerald-500/10 rounded-3xl flex items-center justify-center mb-8 group-hover:bg-emerald-500/20 transition-colors">
                    <span class="text-7xl">🇬🇧</span>
                </div>
                <h2 class="text-4xl font-semibold mb-2">English</h2>
                <p class="text-zinc-400 mb-10 text-xl">Switch to English</p>
                <span class="inline-flex items-center px-10 py-5 bg-emerald-500 hover:bg-emerald-600 text-black font-semibold rounded-2xl text-2xl transition-colors">
                    Go to site <i class="fa-solid fa-arrow-right ml-4"></i>
                </span>
            </a>
        </div>
    </div>
</body>
</html>
