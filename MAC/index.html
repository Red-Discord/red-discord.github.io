<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAC - ¿A dónde quieres ir?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4);
        }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center p-6">
    <div class="max-w-4xl w-full">
        <div class="text-center mb-12">
            <h1 class="text-5xl font-bold mb-3 tracking-tight">¡Bienvenido!</h1>
            <p class="text-2xl text-zinc-400">¿A dónde quieres ir?</p>
        </div>

        <div class="grid md:grid-cols-2 gap-8">
            <!-- Servidor Minecraft -->
            <a href="https://servidormac.github.io/" target="_blank"
               class="card-hover group bg-zinc-900 border border-green-500/30 hover:border-green-500 rounded-3xl p-8 flex flex-col items-center text-center">
                <div class="w-24 h-24 bg-green-500/10 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-green-500/20 transition-colors">
                    <i class="fa-solid fa-cube text-6xl text-green-500"></i>
                </div>
                <h2 class="text-3xl font-semibold mb-2">Servidor de Minecraft</h2>
                <p class="text-zinc-400 mb-8">Únete al servidor, mapa, reglas y más</p>
                <span class="inline-flex items-center px-8 py-4 bg-green-500 hover:bg-green-600 text-black font-semibold rounded-2xl text-xl transition-colors">
                    Ir al servidor <i class="fa-solid fa-arrow-right ml-3"></i>
                </span>
            </a>

            <!-- Buy Me a Coffee -->
            <a href="https://buymeacoffee.com/m.a.c" target="_blank"
               class="card-hover group bg-zinc-900 border border-amber-500/30 hover:border-amber-500 rounded-3xl p-8 flex flex-col items-center text-center">
                <div class="w-24 h-24 bg-amber-500/10 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-amber-500/20 transition-colors">
                    <i class="fa-solid fa-mug-hot text-6xl text-amber-500"></i>
                </div>
                <h2 class="text-3xl font-semibold mb-2">Buy Me a Coffee</h2>
                <p class="text-zinc-400 mb-8">Apoya el proyecto y mantén el servidor vivo</p>
                <span class="inline-flex items-center px-8 py-4 bg-amber-500 hover:bg-amber-600 text-black font-semibold rounded-2xl text-xl transition-colors">
                    Apoyar <i class="fa-solid fa-heart ml-3"></i>
                </span>
            </a>
        </div>

        <div class="text-center mt-16 text-zinc-500 text-sm">
            MAC Network • Hecho con ❤️ para la comunidad
        </div>
    </div>
</body>
</html>
