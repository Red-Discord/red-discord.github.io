<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
       
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }

        /* ====================== TRANSICIÓN DE ENTRADA ====================== */
        @keyframes pageLoad {
            from { opacity: 0; transform: translateY(70px) scale(0.95); filter: blur(14px); }
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        @keyframes globePop {
            0% { opacity: 0; transform: scale(0.3) rotate(-40deg); }
            45% { transform: scale(1.22) rotate(15deg); }
            70% { transform: scale(0.92) rotate(-8deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes lineGrow {
            from { width: 0; opacity: 0; }
            to { width: 7rem; opacity: 1; }
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(55px) scale(0.93); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .main-container { animation: pageLoad 1.45s cubic-bezier(0.23, 1, 0.32, 1) forwards; }
        .fade-in { opacity: 0; animation: fadeUp 0.95s cubic-bezier(0.23, 1, 0.32, 1) forwards; }
        .separator-line { animation: lineGrow 1.1s cubic-bezier(0.4, 0, 0.2, 1) 500ms forwards; }
        .card-hover { opacity: 0; animation: cardEntrance 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

        .card-hover {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.55);
        }

        .glass {
            background: rgba(24, 24, 27, 0.92);
            backdrop-filter: blur(24px);
        }

        .flag-container {
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .group:hover .flag-container {
            transform: scale(1.08) rotate(6deg);
        }

        /* FIX iOS SCROLL */
        html {
            -webkit-overflow-scrolling: touch;
        }
        body {
            overflow-y: auto;
        }
    </style>

    <!-- Tailwind (mismo que antes) -->

<body class="bg-zinc-950 text-white min-h-[100dvh] flex items-center justify-center p-4 sm:p-6">

    <div class="main-container max-w-6xl w-full mx-auto">
       
        <!-- Header -->
        <div class="text-center py-12 sm:py-16 md:py-20">
            <div class="space-y-4 sm:space-y-6">
                <h2 class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-light text-zinc-400 tracking-[-2px] fade-in" style="animation-delay: 300ms;">
                    Elige tu idioma
                </h2>
               
                <div class="separator-line w-24 sm:w-28 h-px bg-gradient-to-r from-transparent via-zinc-500 to-transparent mx-auto"></div>
               
                <h2 class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-light text-zinc-400 tracking-[-2px] fade-in" style="animation-delay: 550ms;">
                    Choose your language
                </h2>
            </div>
        </div>

        <!-- Language Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 sm:gap-8 max-w-2xl mx-auto px-2 sm:px-4">
          
            <!-- Español -->
            <a href="es/" class="group glass border border-zinc-700 hover:border-red-500/70
                        rounded-3xl p-6 sm:p-8 md:p-10 flex flex-col items-center text-center
                        card-hover fade-in" style="animation-delay: 850ms;">
                <div class="flag-container w-24 h-24 sm:w-28 sm:h-28 md:w-32 md:h-32 bg-red-500/10 rounded-3xl
                            flex items-center justify-center mb-6 sm:mb-8
                            border border-red-500/10 group-hover:border-red-500/40 overflow-hidden">
                    <img src="images/es.png" alt="Bandera de España" class="w-[78%] h-[78%] object-contain">
                </div>
                <h2 class="text-3xl sm:text-4xl font-semibold mb-6 text-white tracking-tight">
                    Español
                </h2>
                <span class="inline-flex items-center px-8 sm:px-10 py-4 sm:py-5 bg-red-600 hover:bg-red-500 text-white font-semibold rounded-2xl text-lg sm:text-xl transition-all duration-300 mt-auto">
                    Ir al sitio
                    <i class="fa-solid fa-arrow-right ml-3 transition-transform group-hover:translate-x-1"></i>
                </span>
            </a>

            <!-- English -->
            <a href="en/" class="group glass border border-zinc-700 hover:border-blue-500/70
                        rounded-3xl p-6 sm:p-8 md:p-10 flex flex-col items-center text-center
                        card-hover fade-in" style="animation-delay: 1050ms;">
                <div class="flag-container w-24 h-24 sm:w-28 sm:h-28 md:w-32 md:h-32 bg-blue-500/10 rounded-3xl
                            flex items-center justify-center mb-6 sm:mb-8
                            border border-blue-500/10 group-hover:border-blue-500/40 overflow-hidden">
                    <img src="images/gb.png" alt="GB Flag" class="w-[78%] h-[78%] object-contain">
                </div>
                <h2 class="text-3xl sm:text-4xl font-semibold mb-6 text-white tracking-tight">
                    English
                </h2>
                <span class="inline-flex items-center px-8 sm:px-10 py-4 sm:py-5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-2xl text-lg sm:text-xl transition-all duration-300 mt-auto">
                    Go to site
                    <i class="fa-solid fa-arrow-right ml-3 transition-transform group-hover:translate-x-1"></i>
                </span>
            </a>
        </div>
    </div>
</body>
</html>
