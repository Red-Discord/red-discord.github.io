  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #5865f2, #0f1117);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      background: rgba(20, 22, 30, 0.9);
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      animation: fadeIn 1s ease;
      max-width: 380px;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid #303133;
      margin-bottom: 10px;
    }

    h1 {
      margin: 10px 0 5px;
      font-size: 24px;
    }

    p {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 20px;
    }

    /* BOTÓN GITHUB */
    .github-btn {
    display: inline-block;
    background: linear-gradient(135deg, #6e7bff, #5865F2);
    padding: 12px 22px;
    border-radius: 10px;
    color: white;
    text-decoration: none;
    font-size: 15px;
    font-weight: bold;
    margin: 20px 0px 40px 0px;
    transition: 0.25s;
    box-shadow: 0 0 15px rgba(88,101,242,0.4);
    }

    .github-btn:hover {
      transform: scale(1.07);
      box-shadow: 0 0 15px rgba(88,101,242,0.4);
    }

    /* BOTÓN BUY ME A COFFEE - Más bonito */
    .bmc-btn {
    display: inline-block;
    background: linear-gradient(135deg, #ffdd00, #ffdd00);
    padding: 1px 1px 1px 1px;
    border-radius: 10px;
    color: white;
    text-decoration: none;
    font-size: 0px;
    font-weight: bold;
    margin: 45px 0px 0px 0px;
    transition: 0.25s;
    box-shadow: 0 0 20px rgb(255 221 0);
    }

    .bmc-btn:hover {
      transform: scale(1.08) translateY(-2px);
    box-shadow: 0 0 20px rgb(255 221 0);
    }

    /* IMAGEN PREVIEW */
    .preview-img {
    width: 40%;
    border-radius: 12px;
    margin: 0px 0px 0px 0px;
    box-shadow: 0 0 20px rgb(254 40 88);
    transition: 0.3s;
    }

    .preview-img:hover {
      transform: scale(1.02);
    }

    iframe {
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    
    hr.hr-17 {
      border: 0;
      height: 0;
      box-shadow: 0 0 10px 1px #00000000;
      margin: 20px 0;
    }

    hr.hr-17:after {
      content: "\00a0";
    }
