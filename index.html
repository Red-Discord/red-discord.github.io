        :root {
        --primary: #fe2858;
        --discord: #5865f2;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
        margin: 0;
        font-family: 'Segoe UI', Arial, sans-serif;
        background: radial-gradient(circle at 50% 30%, #fe2858, #0f1117 70%);
        color: white;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow-x: hidden;
        }
        .card {
        background: rgba(15, 17, 23, 0.95);
        backdrop-filter: blur(16px);
        border-radius: 20px;
        padding: 35px 25px;
        max-width: 400px;
        width: 100%;
        text-align: center;
        box-shadow: 0 0 40px rgba(254, 40, 88, 0.4);
        border: 1px solid rgba(254, 40, 88, 0.2);
        animation: fadeInUp 0.8s ease;
        }
        @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
        }
        .avatar {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        border: 4px solid var(--primary);
        margin: 0 auto 15px;
        box-shadow: 0 0 30px rgba(254, 40, 88, 0.6);
        }
        .badge {
        display: inline-block;
        background: linear-gradient(90deg, #fe2858, #ff5e8a);
        color: white;
        font-size: 13px;
        padding: 4px 14px;
        border-radius: 30px;
        margin-bottom: 10px;
        font-weight: bold;
        }
        h1 {
        font-size: 28px;
        margin-bottom: 8px;
        background: linear-gradient(90deg, #fff, #fe2858);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        }
        .subtitle {
        color: #aaa;
        font-size: 16px;
        margin-bottom: 25px;
        line-height: 1.4;
        }
        .highlight {
        background: rgba(254, 40, 88, 0.15);
        padding: 12px;
        border-radius: 12px;
        margin: 20px 0;
        font-size: 15px;
        border-left: 4px solid var(--primary);
        }
        .cta-btn {
        display: block;
        width: 100%;
        padding: 16px;
        margin: 12px 0;
        border-radius: 14px;
        font-size: 17px;
        font-weight: bold;
        text-decoration: none;
        transition: all 0.3s ease;
        border: none;
        cursor: pointer;
        }
        .btn-discord {
        background: linear-gradient(135deg, #5865f2, #4752c4);
        color: white;
        box-shadow: 0 8px 20px rgba(88, 101, 242, 0.4);
        }
        .btn-discord:hover {
        transform: translateY(-3px) scale(1.03);
        box-shadow: 0 12px 25px rgba(88, 101, 242, 0.5);
        }
        .btn-coffee {
        background: linear-gradient(135deg, #ffdd00, #f9c500);
        color: #111;
        font-weight: bold;
        }
        .btn-coffee:hover {
        transform: translateY(-3px) scale(1.03);
        }
        iframe {
        border-radius: 16px;
        margin: 25px 0;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .stats {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin: 20px 0;
        font-size: 14px;
        }
        .stat {
        text-align: center;
        }
        .stat-number {
        font-size: 22px;
        font-weight: bold;
        color: var(--primary);
        }
    </style>
